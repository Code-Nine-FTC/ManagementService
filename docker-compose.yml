services:
  db:
    image: postgres:15-alpine
    container_name: management_db
    restart: unless-stopped
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=pt_BR.UTF-8"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-fatec}
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/teste}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fatec}
      POSTGRES_DB: ${POSTGRES_DB:-teste}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_buffers=2GB # 25% de 8GB RAM
      - -c
      - work_mem=8MB
      - -c
      - effective_cache_size=4GB # Cache estimado do SO
      - -c
      - maintenance_work_mem=256MB # usado para VACUUM/CREATE INDEX
      - -c
      - log_min_duration_statement=10000 # log queries >= 10000ms, definido que queries que demorem mais de 10s são problemáticas(Rodando Localhost)
    ports:
      - "5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${POSTGRES_DB:-teste}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - management-network

  python-api:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: prediction_api
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-teste}
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-fatec}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      TZ: America/Sao_Paulo
    ports:
      - "8000:8000"
    volumes:
      - ./ai/models:/app/models
      - ./ai/src:/app/src
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - management-network

  java-backend:
    build:
      context: .
      dockerfile: Dockerfile.java
    container_name: management_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-teste}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-fatec}
      PREDICTION_API_URL: http://python-api:8000
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-here-change-this-in-production}
      CRYPTO_SECRET: ${CRYPTO_SECRET:-your-crypto-secret-here-change-this-in-production}
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      python-api:
        condition: service_started
    networks:
      - management-network

  ai-trainer:
    profiles: ["ai"]
    build:
      context: ./ai
    container_name: ai_trainer
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-teste}
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-fatec}
      TRAIN_WINDOW_DAYS: 120
      FORECAST_HORIZON_DAYS: 14
      SCHEDULE_CRON: "10 2 * * *"
      MODEL_VERSION: sarimax_v1
      MODE: schedule
      TZ: America/Sao_Paulo
      TRAIN_FORCE: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - management-network

networks:
  management-network:
    driver: bridge

volumes:
  db_data:
    name: management_db_data
